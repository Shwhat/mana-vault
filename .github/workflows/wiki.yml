name: Publish About guide to wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-about-wiki
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          node scripts/wiki-guide.mjs "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update About guide"
            git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin HEAD
          fi
